app-id: org.flatpak.DRC1200
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: DRC1200

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  # Uncomment if your app needs these:
  # - --socket=pulseaudio
  # - --filesystem=home
  # - --share=network

modules:
  # --- wxWidgets, built from source since it's not part of any runtime ---
  - name: wxwidgets
    buildsystem: simple
    build-commands:
      - >-
        ./configure
        --prefix=/app
        --with-gtk=3
        --disable-debug
        --enable-unicode
        --disable-tests
      - make -j$FLATPAK_BUILDER_N_JOBS
      - make install
    sources:
      - type: archive
        url: https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.5/wxWidgets-3.2.5.tar.bz2
        # Run: sha256sum wxWidgets-3.2.5.tar.bz2  (after downloading it once) and paste the result below.
        sha256: 0ad86a3ad3e2e519b6a705248fc9226e3a09bbf069c6c692a02acf7c2d1c6b51

  # --- Your application ---
  - name: DRC1200
    buildsystem: simple
    build-commands:
      - install -D DRC1200 /app/bin/DRC1200
      - install -Dm644 org.flatpak.DRC1200.desktop /app/share/applications/org.flatpak.DRC1200.desktop
      - install -Dm644 org.flatpak.DRC1200.png /app/share/icons/hicolor/256x256/apps/org.flatpak.DRC1200.png
      - install -Dm644 org.flatpak.DRC1200.appdata.xml /app/share/metainfo/org.flatpak.DRC1200.appdata.xml
    sources:
      - type: file
        path: DRC1200
      - type: file
        path: org.flatpak.DRC1200.desktop
      - type: file
        path: org.flatpak.DRC1200.png
      - type: file
        path: org.flatpak.DRC1200.appdata.xml
